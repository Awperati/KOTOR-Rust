[workspace]
resolver = "2"
# gpu/ is a separate package with its own lockfile: it needs crates.io downloads that are not made yet.
exclude = ["gpu"]
members = [
    "crates/kotor-core",
    "crates/kotor-archive",
    "crates/kotor-gff",
    "crates/kotor-tables",
    "crates/kotor-image",
    "crates/kotor-model",
    "crates/kotor-walkmesh",
    "crates/kotor-script",
    "crates/kotor-game",
    "crates/kotor-render",
    "crates/kotor-ui",
    "crates/kotor-audio",
    "crates/kotor-tool",
    "crates/kotor-launcher",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# The tests go through every file of the game, and unoptimised they spend minutes on it. Overflow checks and debug
# assertions stay on, as they are by default in this profile. The crates that read files get full optimisation, and
# the rest stay quick to rebuild.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package.kotor-core]
opt-level = 3
[profile.dev.package.kotor-archive]
opt-level = 3
[profile.dev.package.kotor-image]
opt-level = 3
[profile.dev.package.kotor-model]
opt-level = 3
[profile.dev.package.kotor-gff]
opt-level = 3
[profile.dev.package.kotor-tables]
opt-level = 3
[profile.dev.package.kotor-audio]
opt-level = 3
[profile.dev.package.kotor-walkmesh]
opt-level = 3
[profile.dev.package.kotor-script]
opt-level = 3