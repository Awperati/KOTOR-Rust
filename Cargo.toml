[workspace]
resolver = "2"
# gpu/ is a separate package with its own lockfile: it needs crates.io downloads that are not made yet.
exclude = ["gpu"]
members = [
    "crates/kotor-core",
    "crates/kotor-archive",
    "crates/kotor-gff",
    "crates/kotor-tables",
    "crates/kotor-image",
    "crates/kotor-model",
    "crates/kotor-walkmesh",
    "crates/kotor-script",
    "crates/kotor-game",
    "crates/kotor-render",
    "crates/kotor-tool",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
